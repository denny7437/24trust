# Пример запуска на своём сервере в РФ. Перед приложением — nginx с HTTPS (пример в README).
services:
  site:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
        # Пусто — сборка не пройдёт с заглушками. 1 — черновик для проверки, на боевом сервере не задавайте
        ALLOW_PLACEHOLDERS: ${ALLOW_PLACEHOLDERS:-}
    env_file: .env
    environment:
      LEADS_DIR: /app/data
    volumes:
      # Заявки с персональными данными: отдельный том, бэкап, доступ только у ответственных
      - ./data:/app/data
    ports:
      # Только 127.0.0.1, снаружи — через nginx. Порт на хосте: SITE_PORT в .env, по умолчанию 3000
      - "127.0.0.1:${SITE_PORT:-3000}:3000"
    restart: unless-stopped
